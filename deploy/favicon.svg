<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Black background circle -->
  <circle cx="50" cy="50" r="50" fill="#0a0a0a"/>
  <!-- Gold ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <!-- Crown at top -->
  <path d="M35,28 L40,22 L45,28 L50,20 L55,28 L60,22 L65,28 L63,34 L37,34 Z" fill="url(#gold)"/>
  <!-- AGV monogram -->
  <text x="50" y="60" font-size="22" text-anchor="middle" fill="url(#gold)" font-weight="bold" font-family="serif" letter-spacing="-1">AGV</text>
  <!-- Globe lines at bottom -->
  <circle cx="50" cy="75" r="10" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="40" y1="75" x2="60" y2="75" stroke="url(#gold)" stroke-width="0.8"/>
  <path d="M42,70 Q50,75 58,80 M42,80 Q50,75 58,70" fill="none" stroke="url(#gold)" stroke-width="0.8"/>
</svg>
